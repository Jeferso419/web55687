<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Corazón Galáctico ✦ Nilver T.I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --rose:#ff4d6d;--violet:#9b30d0;--lila:#cc66ff;
      --glass-bg:rgba(10,2,18,0.55);--glass-border:rgba(200,100,255,0.25);
    }
    html,body{width:100%;height:100%;overflow:hidden;background:#000}

    /* ORDEN DE CAPAS:
       z1 = nebulosa fondo
       z2 = rosas
       z3 = corazón  (fondo negro propio para el trail)
       z4 = galaxia Three.js (transparente, ENCIMA del corazón)
       z5 = luna
       z10 = UI
    */
    canvas{position:absolute;left:0;top:0;width:100%;height:100%}
    #nebula-canvas{z-index:1}
    #roses-canvas{z-index:2;pointer-events:none}
    #heart{z-index:3}
    #galaxy-canvas{z-index:4;pointer-events:none;opacity:1;transition:opacity .8s}
    #galaxy-canvas.hidden{opacity:0}
    #moon-canvas{
      left:auto;right:clamp(30px,6vw,80px);top:clamp(30px,6vh,80px);
      width:clamp(110px,18vw,220px);height:clamp(110px,18vw,220px);
      z-index:5;pointer-events:none;
      filter:drop-shadow(0 0 30px rgba(120,60,255,.5));
    }
    #ui-layer{position:absolute;inset:0;z-index:10;pointer-events:none}

    .title-overlay{position:absolute;top:28px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
    .title-overlay h1{
      font-family:'Cinzel',serif;font-size:clamp(1rem,2.5vw,1.8rem);font-weight:600;letter-spacing:.18em;
      background:linear-gradient(135deg,#ff9ab5,#e066ff,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 0 12px rgba(255,80,120,.5));animation:fadeDown 1.2s ease-out both;
    }
    .title-overlay p{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.7rem,1.4vw,1rem);
      color:rgba(255,210,230,.7);margin-top:4px;letter-spacing:.12em;animation:fadeDown 1.4s ease-out both;
    }
    @keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .controls-dock{position:absolute;bottom:28px;right:28px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:all;animation:fadeUp 1.6s ease-out both;z-index:20}
    .music-panel{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
    .btn-play{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(155,48,208,.45);transition:transform .2s,box-shadow .2s}
    .btn-play:hover{transform:scale(1.08);box-shadow:0 6px 22px rgba(255,77,109,.5)}
    .btn-play:active{transform:scale(.95)}
    .music-info{flex:1;overflow:hidden}
    .music-info .song-label{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;color:var(--lila);opacity:.8;text-transform:uppercase;display:block;margin-bottom:2px}
    .music-info .song-name{font-family:'Cormorant Garamond',serif;font-size:.88rem;color:rgba(255,220,240,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
    .volume-wrap{display:flex;align-items:center;gap:6px}
    .volume-icon{font-size:11px;color:rgba(204,102,255,.7);flex-shrink:0}
    input[type=range].vol-slider{width:72px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;outline:none;cursor:pointer;-webkit-appearance:none}
    input[type=range].vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--lila);box-shadow:0 0 6px rgba(204,102,255,.6)}
    input[type=range].vol-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--lila);border:none}
    .btn-galaxy{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:50px;padding:7px 16px;color:rgba(204,102,255,.9);font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;cursor:pointer;transition:background .3s,color .3s,border-color .3s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
    .btn-galaxy:hover{background:rgba(155,48,208,.35);border-color:rgba(204,102,255,.5);color:#fff}
    .btn-galaxy.off{color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.08)}
    .drag-hint{position:absolute;bottom:28px;left:28px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.75rem;color:rgba(204,102,255,.5);letter-spacing:.08em;pointer-events:none;animation:fadeUp 2s ease-out both}
    .equalizer{display:flex;align-items:flex-end;gap:2px;height:14px}
    .eq-bar{width:3px;border-radius:2px;background:var(--lila);animation:eqBounce var(--d,.8s) ease-in-out infinite alternate;height:4px}
    @keyframes eqBounce{to{height:14px;opacity:.6}}
    .eq-bar.paused{animation-play-state:paused}
    @media(max-width:600px){
      .title-overlay h1{font-size:1rem}
      .controls-dock{bottom:16px;right:16px}
      .music-panel{min-width:180px;padding:10px 12px}
      .drag-hint{display:none}
      #moon-canvas{width:clamp(80px,25vw,130px);height:clamp(80px,25vw,130px)}
    }
  </style>
</head>
<body>

<canvas id="nebula-canvas"></canvas>
<canvas id="roses-canvas"></canvas>
<canvas id="heart"></canvas>
<canvas id="galaxy-canvas"></canvas>
<canvas id="moon-canvas" width="440" height="440"></canvas>

<div id="ui-layer">
  <div class="title-overlay">
    <h1>✦ Corazón Galáctico ✦</h1>
    <p>Entre olas y silencios, tu nombre suena a sirena.</p>
  </div>
  <div class="drag-hint">🖱 Alt + Arrastrar para rotar galaxia</div>
  <div class="controls-dock">
    <button class="btn-galaxy" id="btnGalaxy">🌌 GALAXIA ON</button>
    <div class="music-panel">
      <button class="btn-play" id="btnPlay">▶</button>
      <div class="music-info">
        <span class="song-label">REPRODUCTOR</span>
        <span class="song-name" id="songName">Sirena</span>
      </div>
      <div class="volume-wrap">
        <span class="volume-icon">🔊</span>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.02" value="0.6">
      </div>
      <div class="equalizer" id="equalizer">
        <div class="eq-bar paused" style="--d:.6s"></div>
        <div class="eq-bar paused" style="--d:.9s"></div>
        <div class="eq-bar paused" style="--d:.5s"></div>
        <div class="eq-bar paused" style="--d:.7s"></div>
        <div class="eq-bar paused" style="--d:1.1s"></div>
      </div>
    </div>
  </div>
</div>

<audio id="music" loop preload="auto">
  <source src="musica/dracula.mp4" type="audio/mpeg">
</audio>

<!-- NEBULOSA -->
<script>
(function(){
  const cv=document.getElementById('nebula-canvas'),c=cv.getContext('2d');
  let W,H,t=0;
  function h(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
  function s(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);return(h(ix,iy)*(1-ux)+h(ix+1,iy)*ux)*(1-uy)+(h(ix,iy+1)*(1-ux)+h(ix+1,iy+1)*ux)*uy}
  const nb=[{rx:.28,ry:.38,rw:.55,rh:.45,c1:'rgba(35,0,85,',c2:'rgba(75,0,155,'},{rx:.65,ry:.58,rw:.48,rh:.38,c1:'rgba(0,15,75,',c2:'rgba(25,0,115,'},{rx:.12,ry:.62,rw:.42,rh:.32,c1:'rgba(55,0,75,',c2:'rgba(110,15,190,'},{rx:.78,ry:.22,rw:.38,rh:.38,c1:'rgba(18,0,95,',c2:'rgba(55,0,170,'}];
  const st=Array.from({length:700},()=>({x:Math.random(),y:Math.random(),r:.3+Math.random()*1.5,b:Math.random(),ts:.4+Math.random()*2.2,to:Math.random()*Math.PI*2,hu:Math.random()<.3?200+Math.random()*70:0}));
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  window.addEventListener('resize',resize);resize();
  function draw(){
    requestAnimationFrame(draw);t+=.002;
    c.fillStyle='#010006';c.fillRect(0,0,W,H);
    nb.forEach((n2,i)=>{
      const dx=Math.sin(t*.14+i*1.3)*.018,dy=Math.cos(t*.11+i*.9)*.014;
      const cx2=(n2.rx+dx)*W,cy2=(n2.ry+dy)*H,rx=n2.rw*W,ry=n2.rh*H,br=Math.max(rx,ry),bh=1+Math.sin(t*.28+i)*.05;
      const g=c.createRadialGradient(cx2,cy2,0,cx2,cy2,br*bh);
      const p1=.12+Math.sin(t*.42+i*.7)*.04,p2=.04+Math.sin(t*.24+i)*.015;
      g.addColorStop(0,n2.c1+(p1+.06)+')');g.addColorStop(.45,n2.c2+p1+')');g.addColorStop(.78,n2.c1+p2+')');g.addColorStop(1,'rgba(0,0,0,0)');
      c.save();c.scale(rx/br,ry/br);c.fillStyle=g;c.beginPath();c.arc(cx2*br/rx,cy2*br/ry,br*bh,0,Math.PI*2);c.fill();c.restore();
    });
    const bg=c.createLinearGradient(0,H*.15,W,H*.85);
    bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(.3,'rgba(40,0,100,.08)');bg.addColorStop(.5,'rgba(60,0,130,.13)');bg.addColorStop(.7,'rgba(40,0,100,.08)');bg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=bg;c.fillRect(0,0,W,H);
    st.forEach(s2=>{
      const bk=.3+.7*(.5+.5*Math.sin(t*s2.ts+s2.to));
      c.beginPath();c.arc(s2.x*W,s2.y*H,s2.r*bk,0,Math.PI*2);
      c.fillStyle=s2.hu>0?`hsla(${s2.hu},70%,85%,${bk*s2.b})`:`rgba(255,255,255,${bk*s2.b*.9})`;c.fill();
      if(s2.b>.72){const gg=c.createRadialGradient(s2.x*W,s2.y*H,0,s2.x*W,s2.y*H,s2.r*4*bk);gg.addColorStop(0,`rgba(190,130,255,${.18*bk})`);gg.addColorStop(1,'rgba(0,0,0,0)');c.beginPath();c.arc(s2.x*W,s2.y*H,s2.r*4*bk,0,Math.PI*2);c.fillStyle=gg;c.fill()}
    });
  }
  draw();
})();
</script>

<!-- ROSAS -->
<script>
(function(){
  const cv=document.getElementById('roses-canvas'),c=cv.getContext('2d');
  let W,H;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  window.addEventListener('resize',resize);resize();
  function makeRose(sz,hu,v){
    const o=document.createElement('canvas');o.width=o.height=sz;const x=o.getContext('2d');const cx=sz/2,cy=sz/2,np=v===0?5:v===1?6:7;
    for(let i=0;i<np;i++){const a=(i/np)*Math.PI*2+.2,px=cx+Math.cos(a)*sz*.22,py=cy+Math.sin(a)*sz*.22;const g=x.createRadialGradient(px,py,sz*.02,px,py,sz*.3);g.addColorStop(0,`hsla(${hu+15},85%,65%,.92)`);g.addColorStop(.6,`hsla(${hu},72%,48%,.78)`);g.addColorStop(1,`hsla(${hu-15},62%,32%,.1)`);x.beginPath();x.ellipse(px,py,sz*.19,sz*.28,a+Math.PI/2,0,Math.PI*2);x.fillStyle=g;x.fill()}
    for(let i=0;i<np;i++){const a=(i/np)*Math.PI*2,px=cx+Math.cos(a)*sz*.13,py=cy+Math.sin(a)*sz*.13;const g=x.createRadialGradient(px,py,sz*.01,px,py,sz*.22);g.addColorStop(0,`hsla(${hu+25},90%,75%,.96)`);g.addColorStop(.5,`hsla(${hu+8},78%,58%,.86)`);g.addColorStop(1,`hsla(${hu-8},66%,36%,.18)`);x.beginPath();x.ellipse(px,py,sz*.13,sz*.21,a+Math.PI/2,0,Math.PI*2);x.fillStyle=g;x.fill()}
    const cg=x.createRadialGradient(cx,cy,sz*.01,cx,cy,sz*.14);cg.addColorStop(0,`hsla(${hu+35},95%,85%,1)`);cg.addColorStop(.5,`hsla(${hu+15},82%,62%,.96)`);cg.addColorStop(1,`hsla(${hu-12},70%,42%,.5)`);x.beginPath();x.arc(cx,cy,sz*.14,0,Math.PI*2);x.fillStyle=cg;x.fill();
    const gg=x.createRadialGradient(cx,cy,sz*.16,cx,cy,sz*.5);gg.addColorStop(0,`hsla(${hu+10},95%,68%,.35)`);gg.addColorStop(.6,`hsla(${hu},82%,52%,.14)`);gg.addColorStop(1,'rgba(0,0,0,0)');x.beginPath();x.arc(cx,cy,sz*.5,0,Math.PI*2);x.fillStyle=gg;x.fill();
    return o;
  }
  const tx=[makeRose(128,215,0),makeRose(128,240,1),makeRose(128,195,2),makeRose(128,260,0)];
  const N=innerWidth<600?12:22;
  const rs=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,sz:28+Math.random()*55,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.009,vx:(Math.random()-.5)*.35,vy:-.08-Math.random()*.25,op:.35+Math.random()*.55,ti:Math.floor(Math.random()*4),wb:Math.random()*Math.PI*2,wbs:.008+Math.random()*.015,pp:Math.random()*Math.PI*2}));
  let t=0;
  function draw(){
    requestAnimationFrame(draw);t+=.016;c.clearRect(0,0,W,H);
    rs.forEach(r=>{
      r.rot+=r.rs;r.wb+=r.wbs;r.x+=r.vx+Math.sin(r.wb)*.3;r.y+=r.vy;
      if(r.y+r.sz<-10){r.y=H+r.sz;r.x=Math.random()*W}
      if(r.x<-r.sz*2)r.x=W+r.sz;if(r.x>W+r.sz*2)r.x=-r.sz;
      const ds=r.sz*(1+.06*Math.sin(t*1.5+r.pp)),al=r.op*(.85+.15*Math.sin(t*.8+r.pp));
      c.save();c.translate(r.x,r.y);c.rotate(r.rot);c.globalAlpha=al;c.drawImage(tx[r.ti],-ds/2,-ds/2,ds,ds);c.restore();
    });
  }
  draw();
})();
</script>

<!-- CORAZÓN 3D -->
<script>
(function(){
  const cv=document.getElementById('heart'),c=cv.getContext('2d');
  let W,H;const mob=/android|iphone|ipad|ipod/i.test(navigator.userAgent);
  function hp(t){return[16*Math.pow(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}
  let pts=[],parts=[];
  function resize(){
    const dpr=devicePixelRatio||1;W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx=c;c.setTransform(dpr,0,0,dpr,0,0);
    buildHeart();buildParts();
  }
  let ctx=c;
  window.addEventListener('resize',resize);
  function buildHeart(){
    pts=[];const step=mob?.065:.038,sc=Math.min(innerWidth,innerHeight)/42;
    for(let t=0;t<Math.PI*2;t+=step){const p=hp(t);pts.push({x:p[0]*sc,y:p[1]*sc,z:Math.sin(t*2)*2.8})}
    for(let i=0;i<(mob?70:130);i++){const t=Math.random()*Math.PI*2,p=hp(t),s2=(.3+Math.random()*.65)*Math.min(innerWidth,innerHeight)/42;pts.push({x:p[0]*s2,y:p[1]*s2,z:(Math.random()-.5)*4})}
  }
  function buildParts(){
    parts=[];const n=mob?280:560,cx=innerWidth/2,cy=innerHeight/2;
    for(let i=0;i<n;i++){const tgt=Math.floor(Math.random()*pts.length);parts.push({x:cx+(Math.random()-.5)*120,y:cy+(Math.random()-.5)*120,vx:0,vy:0,tgt,or:Math.random()*2.8,os:(Math.random()-.5)*.09,oa:Math.random()*Math.PI*2,tr:Array.from({length:mob?12:26},()=>({x:cx,y:cy})),hu:335+Math.random()*45,sat:72+Math.random()*28})}
  }
  let time=0;
  function draw(){
    requestAnimationFrame(draw);time+=.032;
    c.fillStyle='rgba(2,0,10,.22)';c.fillRect(0,0,innerWidth,innerHeight);
    const bm=Math.sin(time*1.75),be=Math.sin(time*3.5)*.18,pulse=1+(bm+be)*.13;
    const cx0=innerWidth/2,cy0=innerHeight/2+18,sc=Math.min(innerWidth,innerHeight)/42;
    const glR=sc*14*pulse,glG=c.createRadialGradient(cx0,cy0,0,cx0,cy0,glR);
    glG.addColorStop(0,`rgba(255,45,95,${.07*(.5+Math.abs(bm)*.5)})`);glG.addColorStop(.4,'rgba(180,0,90,.04)');glG.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=glG;c.beginPath();c.arc(cx0,cy0,glR,0,Math.PI*2);c.fill();
    parts.forEach(p=>{
      const t2=pts[p.tgt],zf=1+t2.z*.042,tx2=cx0+t2.x*pulse*zf,ty=cy0+t2.y*pulse*zf;
      const dx=tx2-p.x,dy=ty-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<4)p.tgt=Math.floor(Math.random()*pts.length);
      p.vx+=dx*.024;p.vy+=dy*.024;p.vx*=.87;p.vy*=.87;p.oa+=p.os;
      p.x+=p.vx+Math.cos(p.oa)*p.or*.4;p.y+=p.vy+Math.sin(p.oa)*p.or*.4;
      p.tr.unshift({x:p.x,y:p.y});p.tr.pop();
      const depth=(t2.z+4)/8,sz2=1.1+depth*1.2,sp=(sz2)*(1+Math.abs(bm)*.12),br=52+depth*32,al=.5+depth*.38;
      p.tr.forEach((pt,i)=>{const r=1-i/p.tr.length;c.fillStyle=`hsla(${p.hu},${p.sat}%,${br}%,${al*r*.5})`;c.beginPath();c.arc(pt.x,pt.y,sp*r*.65,0,Math.PI*2);c.fill()});
      if(depth>.6){const pg=c.createRadialGradient(p.x,p.y,0,p.x,p.y,sp*2.8);pg.addColorStop(0,`hsla(${p.hu},${p.sat}%,${br+18}%,${al*.28})`);pg.addColorStop(1,'rgba(0,0,0,0)');c.beginPath();c.arc(p.x,p.y,sp*2.8,0,Math.PI*2);c.fillStyle=pg;c.fill()}
      c.fillStyle=`hsla(${p.hu},${p.sat}%,${br+12}%,${al})`;c.beginPath();c.arc(p.x,p.y,sp,0,Math.PI*2);c.fill();
    });
  }
  resize();draw();
})();
</script>

<!-- GALAXIA THREE.JS -->
<script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const gc=document.getElementById('galaxy-canvas');
const scene=new THREE.Scene();
scene.background=null;

const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,2000);
cam.position.set(13,6,18);cam.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({canvas:gc,antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
renderer.toneMapping=THREE.ReinhardToneMapping;
renderer.toneMappingExposure=1.5;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.2,.45,.72);
bloom.threshold=.05;bloom.strength=.9;bloom.radius=.65;
composer.addPass(bloom);

const ov=document.createElement('div');
Object.assign(ov.style,{position:'absolute',inset:'0',zIndex:'6',cursor:'grab',display:'none'});
document.body.appendChild(ov);
const ctrl=new OrbitControls(cam,ov);
ctrl.enableDamping=true;ctrl.dampingFactor=.06;ctrl.rotateSpeed=1.2;
ctrl.autoRotate=true;ctrl.autoRotateSpeed=.45;ctrl.target.set(0,.5,0);
document.addEventListener('keydown',e=>{if(e.altKey)ov.style.display='block'});
document.addEventListener('keyup',()=>ov.style.display='none');

function makeTex(v){
  const cv2=document.createElement('canvas');cv2.width=cv2.height=128;
  const x=cv2.getContext('2d');x.clearRect(0,0,128,128);
